<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randomness.pro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
            background: #f5f5f5;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 40px;
        }

        input {
            width: 80px;
            padding: 10px;
            font-size: 1em;
            text-align: center;
        }

        button {
            padding: 11px 20px;
            font-size: 1em;
            cursor: pointer;
            margin-left: 10px;
        }

        #results {
            text-align: left;
            margin-top: 40px;
            background: white;
            padding: 25px 40px;
            border-radius: 8px;
        }

        li {
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <h1>Randomness.pro</h1>

    <div class="tagline">Randomness, professionally.</div>

    <label for="amount">How many random things?</label>
    <br><br>

    <input type="number" id="amount" value="10" min="1" max="20">

    <button onclick="generateList()">Generate Random List</button>

    <div id="results"></div>

    <script>
        const items = [
            "Alexander Hamilton",
            "The Battle of Waterloo",
            "The Roman Empire",
            "Cleopatra",
            "The Louisiana Purchase",
            "The Silk Road",
            "The Haitian Revolution",
            "Ada Lovelace",
            "The Byzantine Empire",
            "The Great Fire of London",
            "The Kingdom of Kush",
            "The Wright Brothers",
            "The Thirty Years' War",
            "Marie Curie",
            "The Spanish Armada",
            "The Black Death",
            "The Mongol Empire",
            "The Printing Press",
            "The Treaty of Westphalia",
            "The Industrial Revolution"
        ];

        function generateList() {
            const amount = parseInt(document.getElementById("amount").value);

            // Make a copy so the original list isn't changed
            const shuffled = [...items];

            // Fisher-Yates shuffle
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            const selected = shuffled.slice(0, amount);

            let html = "<h2>Your Random List</h2><ol>";

            selected.forEach(item => {
                html += `<li>${item}</li>`;
            });

            html += "</ol>";

            document.getElementById("results").innerHTML = html;
        }
    </script>

</body>
</html>
